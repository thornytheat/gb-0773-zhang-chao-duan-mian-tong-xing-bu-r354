name: hydrology-grid
services:
  app:
    build: .
    ports:
      - "18472:8000"
    environment:
      TIDE_DB: var/tide.sqlite3
      TIDE_REPLICA_DIR: var/replicas
      TIDE_DUTY_CAPACITY: "1"
      TIDE_AUTO_EVICT: "1"
    volumes:
      - tide-journals:/srv/tide/var
volumes:
  tide-journals:
